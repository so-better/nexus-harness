<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; worker-src 'self' blob:; script-src 'self' 'unsafe-inline' nexus-plugin:; style-src 'self' 'unsafe-inline' nexus-plugin:; img-src 'self' data: blob: https: nexus-plugin:; connect-src 'self' nexus-plugin: ws://localhost:* http://localhost:*; frame-src 'self' data:; font-src 'self' data: nexus-plugin:"
    />
    <title>Nexus</title>
    <script>
      (() => {
        const theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
